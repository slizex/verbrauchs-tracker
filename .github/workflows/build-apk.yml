name: Android-APK bauen

# Baut die native Android-App (Capacitor) und haengt die fertige .apk an ein Release.
# Laeuft automatisch bei jeder Aenderung an der Web-App (index.html) oder am mobile/-Ordner,
# sowie manuell ueber den "Run workflow"-Knopf. Die APK wird immer mit DEMSELBEN Schluessel
# (mobile/android-signing.p12) signiert, damit neue Versionen ohne Deinstallation
# ueber die alte druebergespielt werden koennen.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

# Laeuft immer nur der neueste Build; aeltere in Arbeit werden abgebrochen.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Web-App zusammenstellen (www)
        working-directory: mobile
        run: node copy-web.mjs

      - name: Android-Projekt erzeugen
        working-directory: mobile
        run: npx --no-install cap add android

      - name: Plugins synchronisieren
        working-directory: mobile
        run: npx --no-install cap sync android

      - name: App-Icons erzeugen (optional)
        working-directory: mobile
        run: npx --no-install capacitor-assets generate --android || echo "Icon-Erzeugung uebersprungen"

      # Wenn das Repo-Secret ANDROID_KEYSTORE_B64 gesetzt ist, wird die APK mit
      # diesem festen Schluessel signiert (Updates ohne Deinstallation moeglich).
      # Andernfalls faellt der Build auf eine Debug-Signatur zurueck (funktioniert
      # ebenfalls, aber jede neue Version muss vorher deinstalliert werden).
      - name: Signatur vorbereiten
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Fester Signatur-Schluessel gefunden."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Kein Schluessel-Secret – baue mit Debug-Signatur."
          fi

      - name: APK bauen
        working-directory: mobile/android
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ALIAS=$(keytool -list -keystore "$GITHUB_WORKSPACE/release.p12" -storepass "$KS_PW" -storetype PKCS12 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')
            if [ -z "$ALIAS" ]; then echo "Kein Schluessel-Alias gefunden"; exit 1; fi
            echo "Signiere Release mit Alias: $ALIAS"
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.p12" \
              -Pandroid.injected.signing.store.password="$KS_PW" \
              -Pandroid.injected.signing.key.alias="$ALIAS" \
              -Pandroid.injected.signing.key.password="$KS_PW"
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Fertige APK einsammeln
        run: |
          REL="mobile/android/app/build/outputs/apk/release/app-release.apk"
          DBG="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$REL" ]; then cp "$REL" alltrack.apk
          elif [ -f "$DBG" ]; then cp "$DBG" alltrack.apk
          else
            echo "Keine APK gefunden:"; ls -R mobile/android/app/build/outputs/apk || true; exit 1
          fi
          rm -f "$GITHUB_WORKSPACE/release.p12"
          ls -l alltrack.apk

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: alltrack-apk
          path: alltrack.apk

      - name: Release aktualisieren (feste Adresse fuer den Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AllTrack (Android-App)
          prerelease: true
          files: alltrack.apk
          body: |
            Automatisch gebaute Android-App – aktualisiert sich bei jeder Aenderung an der App.
            Immer mit demselben Schluessel signiert, daher ohne Deinstallation aktualisierbar.

            **Installation / Update auf dem Handy:**
            1. Datei `alltrack.apk` unten antippen und herunterladen.
            2. In der heruntergeladenen Datei auf "Installieren" (bzw. "Aktualisieren") tippen.
            3. Beim allerersten Mal ggf. "Installation aus unbekannten Quellen" fuer den Browser/Dateimanager erlauben.

            Hinweis: Wenn zuvor eine aeltere Test-APK installiert war, diese einmalig deinstallieren
            (die App-Daten liegen ohnehin sicher in der Cloud) – danach lassen sich alle kuenftigen
            Updates direkt drueberspielen.
