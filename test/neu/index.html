<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="robots" content="noindex">
<title>AllTrack</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Hell/Dunkel sofort setzen, bevor etwas gezeichnet wird (kein Aufblitzen). */
(function(){try{var t=localStorage.getItem("vtV2Theme");var d=t?t==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark");}catch(e){}})();
</script>
<style>
/* ================= Schrift ================= */
@font-face{font-family:"Nunito";src:url("fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}

/* ================= Farben & Maße ================= */
:root{
  --bg:#f7f4ef;--surface:#ffffff;--surface-2:#f2eee7;--surface-3:#e9e3d9;
  --line:#e7e0d5;--line-2:#d9d0c2;
  --text:#231f1a;--muted:#7a7166;--muted-2:#a39a8d;
  --ink:#231f1a;--ink-fg:#fffaf2;
  --pos:#1f9d62;--pos-bg:#e3f5ec;--neg:#d8453a;--neg-bg:#fde8e5;--warn:#b86e00;--warn-bg:#fff1d6;--info:#3b6fd8;--info-bg:#e6eefc;
  --strom:#e8930c;--strom-bg:#fff2d9;--wasser:#1a9fd8;--wasser-bg:#e0f3fb;--gas:#ec6431;--gas-bg:#fde7dc;
  --r-xl:28px;--r-lg:22px;--r:16px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(35,31,26,.05);
  --sh-2:0 1px 2px rgba(35,31,26,.04),0 10px 28px -14px rgba(35,31,26,.22);
  --sh-3:0 18px 50px -18px rgba(35,31,26,.38);
  --nav-h:74px;--side-w:248px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html.dark{
  --bg:#15130f;--surface:#1f1c17;--surface-2:#28241e;--surface-3:#332e27;
  --line:#353029;--line-2:#453f36;
  --text:#f4efe7;--muted:#a89e90;--muted-2:#7e7569;
  --ink:#f4efe7;--ink-fg:#15130f;
  --pos:#45d28f;--pos-bg:rgba(69,210,143,.13);--neg:#ff7d70;--neg-bg:rgba(255,125,112,.13);--warn:#ffb547;--warn-bg:rgba(255,181,71,.13);--info:#86a8ff;--info-bg:rgba(134,168,255,.13);
  --strom:#ffb23e;--strom-bg:rgba(255,178,62,.14);--wasser:#4cc3f5;--wasser-bg:rgba(76,195,245,.14);--gas:#ff8757;--gas-bg:rgba(255,135,87,.14);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  --sh-3:0 18px 50px -18px rgba(0,0,0,.75);
}

/* ================= Grundlagen ================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;vertical-align:middle;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--info) 55%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= App-Rahmen ================= */
.shell{min-height:100vh}
.main{padding:18px 16px calc(var(--nav-h) + 52px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:0 0 10px;color:var(--muted);font-size:.72rem;font-weight:700;border-radius:14px;transition:color .15s}
.nb[aria-current="page"]{color:var(--text)}
.nb[aria-current="page"] .nbi{background:var(--surface-2)}
.nbi{display:grid;place-items:center;width:44px;height:30px;border-radius:12px;transition:background .15s}
/* Der runde Ablesen-Knopf schwebt ueber der Leiste und macht sie nicht hoeher. */
.nb-read{position:relative}
/* Farbring als Verlaufsrand: haengt nicht von der Ebenen-Reihenfolge ab (transform erzeugt eine eigene). */
.nb-read .fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--ink-fg);border:4px solid transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,conic-gradient(from 200deg,var(--strom),var(--wasser),var(--gas),var(--strom)) border-box;box-shadow:var(--sh-3)}
.nb-read .lbl{margin-top:0}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:var(--side-w) 1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;padding:6px 10px 18px}
  .brand .logo{width:34px;height:34px;border-radius:10px;box-shadow:var(--sh-1)}
  .sb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;color:var(--muted)}
  .sb:hover{background:var(--surface-2);color:var(--text)}
  .sb[aria-current="page"]{background:var(--surface-2);color:var(--text)}
  .sb-read{margin:4px 0 12px;justify-content:center;background:var(--ink);color:var(--ink-fg)!important;box-shadow:var(--sh-2)}
  .sb-read:hover{background:var(--ink);filter:brightness(1.08)}
  .main{padding:30px 34px 48px}
}

/* ================= Kopfzeile ================= */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.greet{color:var(--muted);font-weight:700;font-size:.92rem}
.hh{display:inline-flex;align-items:center;gap:6px;font-size:1.55rem;font-weight:900;letter-spacing:-.01em;line-height:1.15;border-radius:12px;padding:2px 4px;margin-left:-4px}
.hh.can:hover{background:var(--surface-2)}
.pt{font-size:1.55rem;font-weight:900;letter-spacing:-.01em;margin:4px 2px 16px}

/* ================= Karten ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px}
.grid{display:grid;gap:14px}
/* Rasterzellen duerfen schrumpfen – sonst sprengt breiter Inhalt (Tabellen) die Seitenbreite */
.grid>*{min-width:0}
@media (min-width:900px){.grid-2{grid-template-columns:1.25fr 1fr;align-items:start}}
.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:900;font-size:1.05rem}
.sect .more{font-size:.86rem;font-weight:800;color:var(--muted)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 18px;border:1px solid var(--line);box-shadow:var(--sh-2);background:var(--surface)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,var(--hero-tint) 0%,transparent 60%),radial-gradient(90% 80% at 0% 100%,var(--hero-tint-2) 0%,transparent 55%);opacity:1;pointer-events:none}
.hero.pos{--hero-tint:color-mix(in srgb,var(--pos) 22%,transparent);--hero-tint-2:color-mix(in srgb,var(--wasser) 14%,transparent)}
.hero.neg{--hero-tint:color-mix(in srgb,var(--neg) 20%,transparent);--hero-tint-2:color-mix(in srgb,var(--strom) 14%,transparent)}
.hero>*{position:relative}
.hero .lbl{font-weight:800;color:var(--muted);font-size:.9rem}
.hero .big{font-size:2.9rem;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:6px 0 2px}
.hero.pos .big{color:var(--pos)}.hero.neg .big{color:var(--neg)}
.hero .state{font-weight:800}
.hero .sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.hero .tog{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.88rem;color:var(--muted)}
.hbreak{margin-top:12px;display:grid;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.hrow .v{margin-left:auto;font-weight:900}

/* Bereichs-Abzeichen */
.cb{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.cb.strom{background:var(--strom-bg);color:var(--strom)}.cb.wasser{background:var(--wasser-bg);color:var(--wasser)}.cb.gas{background:var(--gas-bg);color:var(--gas)}
.cb.sm{width:30px;height:30px;border-radius:10px}

/* Faellig-Karte */
.due{display:flex;align-items:center;gap:14px;border-radius:var(--r-lg);padding:16px;background:var(--ink);color:var(--ink-fg);box-shadow:var(--sh-2)}
.due .dots{display:flex}
.due .dots .cb{border:3px solid var(--ink);margin-left:-8px}
.due .dots .cb:first-child{margin-left:0}
.due .t{font-weight:900}
.due .s{opacity:.72;font-size:.86rem}
.due .go{margin-left:auto}
.done{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--pos-bg);color:var(--pos);font-weight:800}
.done small{display:block;color:var(--muted);font-weight:700}

/* Kacheln */
.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.tiles.t3{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);transition:transform .15s var(--ease),box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile .hd{display:flex;align-items:center;gap:10px}
.tile .nm{font-weight:900;font-size:1.05rem}
.tile .mt{color:var(--muted);font-size:.84rem;font-weight:700}
.tile .row{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.tile .cost{font-size:1.45rem;font-weight:900;letter-spacing:-.01em}
.tile .spark{display:block;width:100%;height:38px;margin-top:10px}
.tile .foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:.82rem;font-weight:700}

/* Pillen & Chips */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:900;font-size:.8rem;white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}.pill.mut{background:var(--surface-2);color:var(--muted)}
.pos-t{color:var(--pos)}.neg-t{color:var(--neg)}.mut-t{color:var(--muted)}

/* Vorschlaege */
.sugs{display:grid;gap:10px}
.sug{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 14px 14px;box-shadow:var(--sh-1)}
.sug .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sug.info .si{background:var(--info-bg);color:var(--info)}.sug.warn .si{background:var(--warn-bg);color:var(--warn)}.sug.good .si{background:var(--pos-bg);color:var(--pos)}.sug.bad .si{background:var(--neg-bg);color:var(--neg)}
.sug .sb2{flex:1;min-width:0}
.sug .st{font-weight:900}
.sug .sx{color:var(--muted);font-size:.9rem;margin-top:1px}
.sug .sa{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.sug .dis{color:var(--muted-2);padding:4px;border-radius:10px;margin:-4px -4px 0 0}
.sug .dis:hover{color:var(--text);background:var(--surface-2)}

/* Knoepfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-weight:900;box-shadow:var(--sh-1);transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn.lg{min-height:54px;font-size:1.05rem;padding:0 26px}
.btn.full{width:100%}
.btn.soft{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.line{background:transparent;color:var(--text);border:1.5px solid var(--line-2);box-shadow:none}
.btn.onink{background:var(--ink-fg);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.lnk{font-weight:900;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--surface-2);color:var(--text)}

/* Bottom-Sheet / Popover */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(21,19,15,.38);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--sh-3);transform:translateY(100%);transition:transform .26s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{margin:4px 0 12px;font-size:1.15rem;font-weight:900}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s var(--ease),opacity .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:14px;font-weight:800}
.opt:hover{background:var(--surface-2)}
.opt .ck{margin-left:auto;color:var(--pos)}

/* Hinweise, Leerzustaende, Laden */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-lg);padding:14px 16px;background:var(--warn-bg);color:var(--text)}
.note .ni{color:var(--warn);margin-top:1px}
.note b{display:block}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-weight:900}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;width:max-content;max-width:calc(100% - 28px);background:var(--ink);color:var(--ink-fg);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);display:flex;align-items:center;gap:12px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.err{background:var(--neg);color:#fff}
/* bei offenem Fenster oben, damit keine Knoepfe verdeckt werden */
#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px)}
#toast.top.on{transform:translate(-50%,0)}
#toast button{font-weight:900;text-decoration:underline;text-underline-offset:3px}
@media (min-width:900px){#toast{bottom:28px}}

/* Anmeldung */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authc{width:100%;max-width:400px}
.authc .logo{display:block;width:64px;height:64px;border-radius:18px;margin-bottom:18px;box-shadow:var(--sh-2)}
.authc h1{font-size:2rem;font-weight:900;margin:0 0 4px;letter-spacing:-.02em}
.authc p{color:var(--muted);margin:0 0 22px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-weight:800;font-size:.88rem;margin:0 0 6px 4px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.amsg{min-height:22px;margin:10px 4px;font-weight:800;font-size:.9rem}
.amsg.err{color:var(--neg)}.amsg.ok{color:var(--pos)}
.arow{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ================= Ablesen ================= */
.flow{max-width:560px;margin:0 auto}
.fhead{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.fhead .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:.9rem}
.dots2{display:flex;gap:5px;align-items:center}.dots2 i{width:8px;height:8px;border-radius:9px;background:var(--line-2);transition:width .2s}.dots2 i.on{background:var(--ink);width:22px}.dots2 i.ok{background:var(--pos)}
.mhead{display:flex;align-items:center;gap:14px}
.mhead .cb{width:54px;height:54px;border-radius:17px}
.mhead h2{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.01em}
.mmeta{color:var(--muted);font-weight:700;font-size:.88rem}
.mrow{display:flex;gap:10px;align-items:stretch;margin-top:18px}
.minp{flex:1;position:relative;display:block;min-width:0}
.minp input{width:100%;height:78px;border-radius:22px;border:2px solid var(--line-2);background:var(--surface);font-size:2.2rem;font-weight:900;padding:0 64px 0 20px;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
.minp input:focus{border-color:var(--ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--ink) 9%,transparent)}
.minp .u{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--muted);pointer-events:none}
.camb{width:78px;flex:none;border-radius:22px;background:var(--surface-2);display:grid;place-items:center;position:relative;color:var(--text)}
.camb:hover{background:var(--surface-3)}
.camb .ki{position:absolute;right:8px;bottom:8px;font-size:.6rem;font-weight:900;background:var(--ink);color:var(--ink-fg);border-radius:6px;padding:1px 5px}
.camb:disabled{cursor:default}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{display:flex;align-items:flex-start;gap:8px;margin:10px 4px 0;font-weight:800;font-size:.9rem;color:var(--muted);min-height:22px}
.amp{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--line-2)}
.amp.green{background:var(--pos)}.amp.yellow{background:var(--warn)}.amp.red{background:var(--neg)}
.hint.red{color:var(--neg)}.hint.yellow{color:var(--warn)}.hint.green{color:var(--pos)}
.fsec{margin-top:14px}
.linkbtn{font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.linkbtn:hover{color:var(--text)}
.dateline{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-weight:800;color:var(--muted)}
.dateline input{margin-left:auto;border:0;background:transparent;font-weight:900;color:var(--text);outline:none;min-width:0}
.factions{display:grid;gap:12px;margin-top:22px}
.frow2{display:flex;justify-content:space-between;gap:10px;padding:0 4px}
.mchange{margin-top:14px;padding:16px;border-radius:18px;border:1.5px dashed var(--line-2)}

function consumptionAnomalies(){

  return householdCats().map(function(c){
    var hist=history(c).filter(function(r){return !r.baseline&&isFinite(r.verbrauch);});
    if(hist.length<4)return null;
    var last=hist[hist.length-1];
    if(last.synthetic||last.estimated)return null;               /* nur echte Ablesungen bewerten */
    if(billIndex(last.reading.datum)>=curIdx)return null;         /* laufenden Monat nicht bewerten (unvollständig) */
    var m=((billIndex(last.reading.datum)%12)+12)%12;
    var prior=hist.slice(0,-1);
    var sameMonth=prior.filter(function(r){return ((billIndex(r.reading.datum)%12)+12)%12===m;});
    var baseRows=sameMonth.length?sameMonth:prior.slice(-12);
    if(!baseRows.length)return null;
    var base=baseRows.reduce(function(s,r){return s+r.verbrauch;},0)/baseRows.length;
    if(!(base>0))return null;
    var pct=(last.verbrauch-base)/base*100;

  }).filter(Boolean);

  s=String(s).trim();var m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/))return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  return null;
}
function parseReadingsCSV(text){
  text=text.replace(/^﻿/,"");
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!=="";});
  if(!lines.length)return {rows:[],skipped:0};
  var sep=lines[0].indexOf(";")>=0?";":(lines[0].indexOf("\t")>=0?"\t":",");
  var header=splitCSV(lines[0],sep).map(function(h){return h.trim().toLowerCase();});
  var di=header.findIndex(function(h){return /ablese|datum/.test(h);});
  var zi=header.findIndex(function(h){return /z[äa]hler|stand/.test(h);});
  var start=1;
  if(di<0||zi<0){di=0;zi=1;start=0;}
  var rows=[],skipped=0;
  for(var i=start;i<lines.length;i++){
    var ce=splitCSV(lines[i],sep);
    var iso=parseDateAny(ce[di]||""),z=parseNum(ce[zi]||"");
    /* Zukunftsdaten werden wie ungültige Zeilen behandelt und mitgezählt. */
    if(iso&&iso<=todayISO()&&isFinite(z)&&String(ce[zi]).trim()!=="")rows.push({datum:iso,zaehler:z});
    else skipped++;
  }
  return {rows:rows,skipped:skipped};
}

var _localSeq=0,_flushing=false;
function isOffline(){return navigator.onLine===false;}
function applyLocalReading(cat,iso,z,sw){
  var mk=billKey(iso),list=STATE[cat].readings;
  var ex=list.find(function(r){return billKey(r.datum)===mk;});
  var stamp=new Date().toISOString(),start=(isFinite(sw)?sw:null);
  if(ex){ex.datum=iso;ex.zaehlerstand=z;ex.startwert=start;ex.erfasstAm=stamp;}
  else list.push({id:"local-"+(++_localSeq),datum:iso,zaehlerstand:z,startwert:start,erfasstAm:stamp});
}
/* Pro Abrechnungsmonat gibt es höchstens eine Ablesung. */
function readingInMonth(cat,iso,exceptId){var mk=billKey(iso);return STATE[cat].readings.find(function(r){return billKey(r.datum)===mk&&r.id!==exceptId;})||null;}
/* Speichert eine Ablesung. editId = genau diesen Datensatz ändern (auch wenn das Datum in einen anderen Monat rutscht).
   Rückfragen (Monat schon belegt, unplausibel) stellt die Oberfläche VOR dem Aufruf. Wirft Error mit deutscher Meldung. */
async function saveReadingData(cat,iso,z,sw,editId){
  if(!iso)throw new Error("Bitte ein Ablesedatum wählen.");
  if(iso>todayISO())throw new Error("Das Ablesedatum liegt in der Zukunft ("+deDate(iso)+").");
  if(!isFinite(z))throw new Error("Bitte einen gültigen Zählerstand eingeben.");
  if(!tariffForDate(cat,iso)){var e=new Error("Für dieses Datum gibt es noch keinen "+CATS[cat].label+"-Tarif.");e.code="NO_TARIFF";throw e;}
  var editing=editId?STATE[cat].readings.find(function(r){return r.id===editId;}):null;
  if(editing&&readingInMonth(cat,iso,editing.id))throw new Error("Für "+billLabel(iso)+" gibt es schon eine andere Ablesung.");
  var existing=editing||readingInMonth(cat,iso);
  if(isOffline()){
    if(editing)throw new Error("Bearbeiten geht erst wieder online.");
    var q=loadQueue();q.push({t:"reading",household_id:activeHousehold,cat:cat,datum:iso,zaehlerstand:z,startwert:(isFinite(sw)?sw:null)});saveQueue(q);
    applyLocalReading(cat,iso,z,sw);_histMemo=null;_tgMemo=null;
    return {queued:true};
  }
  var start=isFinite(sw)?sw:null,res;
  if(existing){
    res=await sb.from("readings").update({datum:iso,zaehlerstand:z,startwert:start,erfasst_am:new Date().toISOString()}).eq("id",existing.id).select().single();
    if(res.error)throw res.error;
    var ix=STATE[cat].readings.findIndex(function(r){return r.id===existing.id;});STATE[cat].readings[ix]=rowToReading(res.data);
  }else{
    res=await sb.from("readings").insert(readingToCols(cat,{datum:iso,zaehlerstand:z,startwert:start})).select().single();
    if(res.error)throw res.error;
    STATE[cat].readings.push(rowToReading(res.data));
  }
  _histMemo=null;_tgMemo=null;
  return {id:res.data.id};
}
/* Offline gesammelte Ablesungen übertragen, sobald wieder Netz da ist. */
async function flushQueue(){
  if(_flushing||isOffline()||!currentUser||!activeHousehold||LOAD_FAILED)return;
  var q=loadQueue();if(!q.length)return;
  _flushing=true;
  try{await loadFromDB();}catch(e){_flushing=false;return;}
  var remain=[],ok=0,fail=0;
  for(var i=0;i<q.length;i++){
    var op=q[i];
    if(op.t!=="reading"||op.household_id!==activeHousehold){remain.push(op);continue;}
    try{
      var mk=billKey(op.datum),start=(op.startwert!=null?op.startwert:null);
      var ex=STATE[op.cat].readings.find(function(r){return billKey(r.datum)===mk&&String(r.id).indexOf("local-")!==0;});
      var r=ex
        ?await sb.from("readings").update({datum:op.datum,zaehlerstand:op.zaehlerstand,startwert:start,erfasst_am:new Date().toISOString()}).eq("id",ex.id)
        :await sb.from("readings").insert(readingToCols(op.cat,{datum:op.datum,zaehlerstand:op.zaehlerstand,startwert:start}));
      if(r.error)throw r.error;ok++;
    }catch(e){fail++;remain.push(op);}
  }
  saveQueue(remain);_flushing=false;
  try{await loadFromDB();}catch(e){}
  render();
  if(ok)toast(ok+" offline gespeicherte Ablesung"+(ok===1?"":"en")+" übertragen"+(fail?", "+fail+" folgen später":""),fail>0);
}

/* ---- Erwarteter Zählerstand (intelligente Vorschläge „Beim Ablesen“) ----
   Aus den Rohständen: Zuwachs pro Tag zwischen zwei Ablesungen, bevorzugt aus demselben
   Kalendermonat der Vorjahre (Gas im Winter ≠ Sommer), sonst Ø der letzten 12 Abschnitte.
   Zählerwechsel-Abschnitte zählen nicht mit. */
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function lastReadingBefore(cat,iso){var rs=readingsAsc(cat).filter(function(r){return r.datum<iso;});return rs.length?rs[rs.length-1]:null;}
function meterRates(cat){
  var rs=readingsAsc(cat),out=[];
  for(var i=1;i<rs.length;i++){
    var a=rs[i-1],b=rs[i];
    if(b.startwert!=null&&isFinite(b.startwert))continue;
    var d=daysBetween(a.datum,b.datum),dz=b.zaehlerstand-a.zaehlerstand;
    if(d<5||!(dz>=0))continue;
    out.push({rate:dz/d,month:((billIndex(b.datum)%12)+12)%12});
  }
  return out;
}
function expectedMeter(cat,iso){
  var last=lastReadingBefore(cat,iso);if(!last)return null;
  var days=daysBetween(last.datum,iso);if(days<=0)return null;
  var rates=meterRates(cat);if(rates.length<3)return null;
  var m=((billIndex(iso)%12)+12)%12,same=rates.filter(function(r){return r.month===m;});
  var pool=same.length?same:rates.slice(-12);
  var avg=pool.reduce(function(s,r){return s+r.rate;},0)/pool.length;
  return {value:last.zaehlerstand+avg*days,delta:avg*days,last:last,days:days,seasonal:same.length>0};
}
/* Ampel für einen eingegebenen Stand. sw = Anfangsstand bei Zählerwechsel. */
function meterCheck(cat,iso,z,sw){
  var u=CATS[cat].unit;
  if(!isFinite(z))return {level:"red",text:"Bitte eine Zahl eingeben."};
  if(isFinite(sw)){return z<sw?{level:"red",text:"Kleiner als der Anfangsstand des neuen Zählers."}:{level:"green",text:"Neuer Zähler: "+fmtVal(cat,z-sw)+" "+u+" seit dem Einbau."};}
  var last=lastReadingBefore(cat,iso);if(!last)return null;
  if(z<last.zaehlerstand)return {level:"red",text:"Niedriger als zuletzt ("+fmtVal(cat,last.zaehlerstand)+"). Neuer Zähler eingebaut?"};
  var e=expectedMeter(cat,iso);if(!e||!(e.delta>0))return null;
  var d=z-last.zaehlerstand,q=d/e.delta,dd=fmtVal(cat,d)+" "+u,ed=fmtVal(cat,e.delta)+" "+u;
  if(q>=0.5&&q<=1.8)return {level:"green",text:"Passt – "+dd+" seit der letzten Ablesung."};
  if(q>6)return {level:"red",text:"Das wären "+dd+" – rund "+Math.round(q)+"× so viel wie üblich. Ziffer vertauscht?"};
  if(q<0.5)return {level:"yellow",text:"Weniger als üblich: "+dd+" statt ca. "+ed+"."};
  return {level:"yellow",text:"Mehr als üblich: "+dd+" statt ca. "+ed+"."};
}

/* Fotos vor dem Senden verkleinern: schneller, günstiger, und die KI-Funktion nimmt max. ~6 MB. */
async function photoB64(file){
  try{
    var bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    var s=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    var d=c.toDataURL("image/jpeg",0.85);return {b64:d.slice(d.indexOf(",")+1),mime:"image/jpeg"};
  }catch(e){
    if(file.size>6*1024*1024)throw new Error("Das Bild ist zu groß.");
    return {b64:await fileToBase64(file),mime:file.type||"image/jpeg"};
  }
}

/* ================= 4. Intelligente Vorschläge ================= */
/* Alle Werte stammen aus den eigenen Daten – keine KI, keine externen Dienste.
   Jede Gruppe lässt sich pro Person unter „Mehr“ abschalten. */
function catRows(cat){return history(cat).filter(function(r){return !r.baseline&&isFinite(r.verbrauch);});}
function lastRow(cat){var r=catRows(cat);return r.length?r[r.length-1]:null;}
function currentGroup(cat){var cur=tariffForDate(cat,todayISO());return cur?tariffGroups(cat).find(function(g){return g.tid===cur.id;})||null:null;}
function catSaldo(cat){var g=currentGroup(cat);return g?g.saldo:0;}
function totalSaldo(){return householdCats().reduce(function(s,c){return s+catSaldo(c);},0);}
function hasData(cat){return STATE[cat].tariffs.length>0||STATE[cat].readings.length>0;}
function monthName(key){var n=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];return n[Number(key.slice(5,7))-1]+" "+key.slice(0,4);}

/* Monatlicher Bedarf = Ø Gesamtkosten der letzten 12 abgerechneten Monate (mind. 6). */
function monthlyNeed(cat){
  var rows=catRows(cat).filter(function(r){return isFinite(r.gesamtkosten);}).slice(-12);
  if(rows.length<6)return null;
  return rows.reduce(function(s,r){return s+r.gesamtkosten;},0)/rows.length;
}
/* Prognose zur nächsten Abrechnung: laufendes 12-Monats-Stück des aktuellen Tarifs + Vorschau der Restmonate. */
function nextBillForecast(cat){
  var g=currentGroup(cat);if(!g||!g.years.length)return null;
  var y=g.years[g.years.length-1];
  if(y.complete||y.rows.length<2)return null;
  var rest=12-y.rows.length,fc=forecastRows(cat,rest);
  if(fc.length<rest||fc.some(function(r){return !isFinite(r.differenz);}))return null;
  var proj=y.sum+fc.reduce(function(s,r){return s+r.differenz;},0);
  var endKey=billKey(fc.length?fc[fc.length-1].reading.datum:y.end);
  return {cat:cat,sofar:y.sum,proj:proj,endKey:endKey,months:y.rows.length};
}
function yearCostWith(t,cat){var v=annualVerbrauchEst(cat);if(v==null||!t)return null;return t.grundpreisJahr+CATS[cat].verbrauchskosten(t,v);}

function buildSuggestions(){
  if(LOAD_FAILED||!smartCfg().on)return [];
  var out=[],cats=householdCats(),today=todayISO();
  function add(s){if(!isNotifDismissed(s.key))out.push(s);}

  if(smartOn("geld")){
    cats.forEach(function(cat){
      var need=monthlyNeed(cat),ab=abschlagForDate(cat,today);
      if(need==null||!(ab>0))return;
      var diff=ab-need,lim=Math.max(5,ab*0.08),rec=Math.ceil(need);
      if(diff>lim)add({key:"s:abschlag|"+cat+"|"+ab+"|down",group:"geld",prio:40,tone:"good",icon:"wallet",cat:cat,
        title:CATS[cat].label+"-Abschlag senken?",
        text:"Du zahlst "+eur(ab)+", der Bedarf liegt bei Ø "+eur(need)+" im Monat. "+eur(rec)+" würden reichen.",
        action:{label:"Vertrag ansehen",route:"#/vertraege?cat="+cat}});
      else if(-diff>lim)add({key:"s:abschlag|"+cat+"|"+ab+"|up",group:"geld",prio:80,tone:"warn",icon:"alert",cat:cat,
        title:CATS[cat].label+"-Abschlag zu niedrig",
        text:"Bedarf Ø "+eur(need)+" im Monat, du zahlst "+eur(ab)+". Ohne Anpassung droht eine Nachzahlung.",
        action:{label:"Vertrag ansehen",route:"#/vertraege?cat="+cat}});
    });
    var fcs=cats.map(nextBillForecast).filter(Boolean);
    if(fcs.length){
      var sum=fcs.reduce(function(s,f){return s+f.proj;},0),pos=sum>=0;
      add({key:"s:prognose|"+prevBillKey(),group:"geld",prio:30,tone:pos?"good":"bad",icon:pos?"trendUp":"trendDown",
        title:"Prognose zur nächsten Abrechnung",
        text:(pos?"Voraussichtlich ":"Voraussichtlich Nachzahlung: ")+(pos?"+":"")+eur(sum)+(pos?" Guthaben":"")+" – "+fcs.map(function(f){return CATS[f.cat].label+" nach "+monthName(f.endKey);}).join(", ")+".",
        detail:fcs});
    }
  }

  if(smartOn("vertraege")){
    cats.forEach(function(cat){
      var cur=tariffForDate(cat,today);if(!cur)return;
      var ki=kuendigungInfo(cur),name=CATS[cat].label;
      if(ki&&ki.kind==="fixed"&&!ki.ended&&ki.days>=0&&ki.days<=60)
        add({key:"s:frist|"+cat+"|"+ki.deadline,group:"vertraege",prio:ki.days<=21?95:60,tone:ki.days<=21?"warn":"info",icon:"clock",cat:cat,
          title:name+"-Vertrag kündbar bis "+deDate(ki.deadline),
          text:(ki.days===0?"Heute ist der letzte Tag.":"Noch "+ki.days+" Tag"+(ki.days===1?"":"e")+".")+" Danach verlängert er sich.",
          action:{label:"Vertrag ansehen",route:"#/vertraege?cat="+cat}});
      else if(ki&&ki.kind==="fixed"&&ki.ended)
        add({key:"s:ended|"+cat+"|"+cur.id,group:"vertraege",prio:25,tone:"info",icon:"calendar",cat:cat,
          title:name+": jetzt monatlich kündbar",
          text:"Die Mindestlaufzeit ist vorbei – ein guter Moment für einen Tarifvergleich.",
          action:{label:"Vertrag ansehen",route:"#/vertraege?cat="+cat}});
      else if(ki&&ki.kind==="fixed-nostart")
        add({key:"s:nostart|"+cat+"|"+cur.id,group:"vertraege",prio:20,tone:"info",icon:"calendar",cat:cat,
          title:name+": Vertragsbeginn fehlt",
          text:"Mit dem Vertragsbeginn kann ich dich an die Kündigungsfrist erinnern.",
          action:{label:"Ergänzen",route:"#/vertraege?cat="+cat}});
      /* Preisänderung: neuer Tarif seit höchstens 90 Tagen */
      var ts=tariffsAsc(cat),i=ts.findIndex(function(t){return t.id===cur.id;});
      if(i>0&&cur.gueltigAb&&cur.gueltigAb>addDays(today,-90)){
        var a=yearCostWith(ts[i-1],cat),b=yearCostWith(cur,cat);
        if(a!=null&&b!=null&&Math.abs(b-a)>=10){
          var up=b>a;
          add({key:"s:preis|"+cat+"|"+cur.id,group:"vertraege",prio:up?55:35,tone:up?"warn":"good",icon:up?"trendUp":"trendDown",cat:cat,
            title:"Neuer "+name+"-Tarif seit "+deDate(cur.gueltigAb),
            text:"Bei gleichem Verbrauch "+(up?"+":"−")+eur(Math.abs(b-a))+" pro Jahr gegenüber dem vorherigen Tarif.",
            action:{label:"Vertrag ansehen",route:"#/vertraege?cat="+cat}});
        }
      }
    });
  }

  if(smartOn("auffaellig")){
    consumptionAnomalies().forEach(function(a){
      var c=CATS[a.cat],u=c.billUnit||c.unit,mk=billKey(a.month),up=a.dir==="up";
      add({key:"s:anom|"+anomalyKey(a),group:"auffaellig",prio:up?70:30,tone:up?"warn":"good",icon:up?"trendUp":"trendDown",cat:a.cat,
        title:c.label+" im "+monthName(mk)+" "+(up?"+":"")+a.pct+" %",
        text:fmtVerb(a.cat,a.verbrauch)+" statt Ø "+fmtVerb(a.cat,a.base)+" "+u+(a.seasonal?" im selben Monat der Vorjahre.":" der letzten Monate."),
        action:{label:"Verlauf ansehen",route:"#/verlauf?cat="+a.cat}});
    });
    var cut=billIndex(today)-12;
    cats.forEach(function(cat){
      var syn=history(cat).filter(function(r){return r.synthetic&&billIndex(r.reading.datum)>=cut;});
      if(!syn.length)return;
      var months=syn.map(function(r){return monthName(billKey(r.reading.datum)).split(" ")[0];});
      add({key:"s:luecke|"+cat+"|"+billKey(syn[0].reading.datum),group:"auffaellig",prio:15,tone:"info",icon:"info",cat:cat,
        title:CATS[cat].label+": "+syn.length+" Monat"+(syn.length===1?"":"e")+" geschätzt",
        text:"Für "+months.join(", ")+" fehlt eine Ablesung – die Werte sind gleichmäßig verteilt.",
        action:{label:"Im Verlauf ansehen",route:"#/verlauf?cat="+cat}});
    });
  }
  return out.sort(function(a,b){return b.prio-a.prio;});
}

var toastT=null;
function toast(msg,err,undo){
  var t=$("#toast");t.innerHTML="";
  var s=document.createElement("span");s.textContent=msg;t.appendChild(s);
  if(undo){var b=document.createElement("button");b.textContent="Rückgängig";b.onclick=function(){t.className="";undo();};t.appendChild(b);}
  t.className="on"+(err?" err":"")+(sheetEl?" top":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className="";},undo?6000:3200);
}
var sheetEl=null,scrimEl=null;
function openSheet(html){
  closeSheet(true);
  scrimEl=document.createElement("div");scrimEl.className="scrim";scrimEl.onclick=function(){closeSheet();};
  sheetEl=document.createElement("div");sheetEl.className="sheet";sheetEl.setAttribute("role","dialog");sheetEl.setAttribute("aria-modal","true");
  sheetEl.innerHTML='<div class="grab"></div>'+html;
  /* Klicks im Fenster nur hier verarbeiten – sonst liefe jede Aktion ein zweites Mal ueber document. */
  sheetEl.addEventListener("click",function(e){onAction(e);e.stopPropagation();});
  document.body.appendChild(scrimEl);document.body.appendChild(sheetEl);
  /* an genau dieses Fenster binden – es kann vor dem naechsten Bild schon wieder ersetzt sein */
  var s0=sheetEl,c0=scrimEl;requestAnimationFrame(function(){c0.classList.add("on");s0.classList.add("on");});
}
function closeSheet(now){
  var s=sheetEl,c=scrimEl;sheetEl=null;scrimEl=null;if(!s)return;
  if(now){s.remove();c.remove();return;}
  s.classList.remove("on");c.classList.remove("on");setTimeout(function(){s.remove();c.remove();},260);
}

var ROUTES=["start","verlauf","ablesen","vertraege","mehr"];
function route(){
  var h=location.hash||"";
  if(h.indexOf("#/")!==0)return {name:"start",params:{}};
  var q=h.slice(2).split("?"),name=q[0]||"start",params={};
  (q[1]||"").split("&").forEach(function(kv){if(!kv)return;var p=kv.split("=");params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||"");});
  if(ROUTES.indexOf(name)<0)name="start";
  return {name:name,params:params};
}

function signed(n){return (n>=0?"+":"−")+eur(Math.abs(n));}
function sparkSvg(vals,cat){
  vals=vals.filter(function(v){return isFinite(v);});
  if(vals.length<2)return "";
  var W=200,H=38,p=3,n=vals.length,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var X=function(i){return p+i*(W-2*p)/(n-1);},Y=function(v){return p+(H-2*p)*(1-(v-mn)/rg);};
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+" "+Y(v).toFixed(1);});
  var col="var(--"+cat+")",gid="g"+cat+Math.random().toString(36).slice(2,6);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="M'+X(0).toFixed(1)+' '+H+' L'+pts.join(" L")+' L'+X(n-1).toFixed(1)+' '+H+' Z" fill="url(#'+gid+')"/>'+
    '<path d="M'+pts.join(" L")+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

/* ---- Ablesen ---- */
/* FLOW hält den Stand eines Ablese-Durchgangs (auch wenn man kurz woandershin tippt). */
var FLOW=null;
function flowKey(p){return [p.cat||"",p.datum||"",p.mode||""].join("|");}
function startFlow(p){
  var withTariff=householdCats().filter(function(c){return STATE[c].tariffs.length>0;});
  var cats,due=readingsDue();
  if(p.cat&&withTariff.indexOf(p.cat)>=0)cats=[p.cat];
  else cats=due.length?due:withTariff;
  var iso=(p.datum&&/^\d{4}-\d{2}-\d{2}$/.test(p.datum)&&p.datum<=todayISO())?p.datum:todayISO();
  FLOW={key:flowKey(p),mode:p.mode==="alle"?"all":"steps",cats:cats,i:0,iso:iso,v:{},saved:[],skipped:[],busy:false,done:false,err:{},
    allCurrent:!p.cat&&!due.length,missing:householdCats().filter(function(c){return withTariff.indexOf(c)<0;})};
  cats.forEach(function(c){FLOW.v[c]={z:"",sw:"",mn:"",mc:false,ai:null,cam:false};});
}
function flowHint(cat){
  var v=FLOW.v[cat],u=CATS[cat].unit,parts=[];
  if(v.ai!==null&&v.z)parts.push({level:"",text:"Von der KI gelesen – bitte prüfen."+(v.ai?" "+v.ai:"")});
  if(smartOn("ablesen")){
    if(!v.z.trim()){var e=expectedMeter(cat,FLOW.iso);if(e&&!v.mc)parts.push({level:"",text:"erwartet ≈ "+fmtVal(cat,e.value)+" "+u});}
    else{var ck=meterCheck(cat,FLOW.iso,parseMeterVal(cat,v.z),v.mc?parseMeterVal(cat,v.sw):NaN);if(ck)parts.push(ck);}
  }
  if(FLOW.err[cat])parts=[{level:"red",text:FLOW.err[cat]}];
  if(!parts.length)return {cls:"",html:""};
  var p=parts[parts.length-1];
  /* KI-Herkunft sichtbar lassen, auch wenn die Ampel etwas sagt */
  if(parts.length>1&&v.ai!==null&&v.z&&!FLOW.err[cat])p={level:p.level,text:"KI-Wert · "+p.text};
  return {cls:p.level,html:'<span class="amp '+p.level+'"></span><span>'+esc(p.text)+'</span>'};
}
function hintEl(cat){var h=flowHint(cat);return '<div class="hint '+h.cls+'" id="h_'+cat+'">'+h.html+'</div>';}
function refreshHint(cat){var el=document.getElementById("h_"+cat);if(!el)return;var h=flowHint(cat);el.className="hint "+h.cls;el.innerHTML=h.html;}
function meterInput(cat,big){

function flowAll(){
  return '<form class="flow" id="flowAllForm" novalidate>'+flowHead()+'<h1 class="pt" style="margin-top:0">Alle Zähler</h1>'+
    dateLine()+'<div style="margin-top:14px">'+

/* Rückfragen vor dem Speichern: Monat schon belegt? Wert unplausibel? */
function flowIssues(cat,z,sw){
  var out=[],ex=readingInMonth(cat,FLOW.iso);
  if(ex)out.push("Für "+billLabel(FLOW.iso)+" gibt es schon eine Ablesung ("+fmtVal(cat,ex.zaehlerstand)+" "+CATS[cat].unit+" am "+deDate(ex.datum)+"). Sie wird ersetzt.");
  var w=plausibilityWarning(cat,FLOW.iso,z,sw);if(w)out.push(w);
  return out;
}
function flowValues(cat){var v=FLOW.v[cat];return {z:parseMeterVal(cat,v.z),sw:v.mc?parseMeterVal(cat,v.sw):NaN,mn:v.mc?v.mn:""};}
function flowValidate(cat){
  var v=FLOW.v[cat],x=flowValues(cat);
  if(!v.z.trim())return "Bitte den Zählerstand eintragen – oder „Überspringen“.";
  if(!isFinite(x.z))return "Das ist keine gültige Zahl.";
  if(v.mc&&!isFinite(x.sw))return "Bitte den Anfangsstand des neuen Zählers eintragen.";
  if(FLOW.iso>todayISO())return "Das Datum liegt in der Zukunft.";
  if(!tariffForDate(cat,FLOW.iso))return "Für dieses Datum gibt es noch keinen "+CATS[cat].label+"-Tarif.";
  return null;
}
function askConfirm(title,lines,yesAction,data){
  openSheet('<h3>'+esc(title)+'</h3>'+lines.map(function(l){return '<p style="margin:0 0 10px;color:var(--muted);font-weight:700">'+esc(l)+'</p>';}).join("")+
    '<div class="factions" style="margin-top:16px"><button class="btn full" data-a="'+yesAction+'"'+(data?' data-cat="'+data+'"':"")+'>Trotzdem speichern</button><button class="btn soft full" data-a="sheet-close">Korrigieren</button></div>');
}
async function flowSaveOne(cat){
  var x=flowValues(cat);
  try{
    var r=await saveReadingData(cat,FLOW.iso,x.z,x.sw,null);
    if(x.mn&&x.mn.trim()&&IAM_ADMIN)await saveMeter(cat,x.mn);
    FLOW.saved=FLOW.saved.filter(function(s){return s.cat!==cat;});
    FLOW.saved.push({cat:cat,queued:!!r.queued});delete FLOW.err[cat];
    return true;
  }catch(e){FLOW.err[cat]=errMsg(e);return false;}
}
async function flowNext(force){
  var cat=FLOW.cats[FLOW.i],bad=flowValidate(cat);
  if(bad){FLOW.err[cat]=bad;refreshHint(cat);return;}
  if(!force){var x=flowValues(cat),iss=flowIssues(cat,x.z,x.sw);if(iss.length){askConfirm("Kurz prüfen",iss,"flow-force");return;}}
  FLOW.busy=true;render();
  var ok=await flowSaveOne(cat);FLOW.busy=false;
  if(!ok){render();return;}
  flowAdvance();
}
function flowAdvance(){
  if(FLOW.i<FLOW.cats.length-1){FLOW.i++;render();focusFlow();}
  else finishFlow();
}
async function flowSaveAll(force){
  var todo=FLOW.cats.filter(function(c){return FLOW.v[c].z.trim()&&!FLOW.saved.some(function(s){return s.cat===c&&FLOW.v[c].savedZ===FLOW.v[c].z;});});
  if(!todo.length){toast("Bitte mindestens einen Zählerstand eintragen.",true);return;}
  var bad=false;todo.forEach(function(c){var b=flowValidate(c);if(b){FLOW.err[c]=b;bad=true;}else delete FLOW.err[c];refreshHint(c);});
  if(bad)return;
  if(!force){
    var iss=[];todo.forEach(function(c){var x=flowValues(c);flowIssues(c,x.z,x.sw).forEach(function(t){iss.push(CATS[c].label+": "+t);});});
    if(iss.length){askConfirm("Kurz prüfen",iss,"flow-force-all");return;}
  }
  FLOW.busy=true;render();
  var allOk=true;
  for(var i=0;i<todo.length;i++){var ok=await flowSaveOne(todo[i]);if(ok)FLOW.v[todo[i]].savedZ=FLOW.v[todo[i]].z;else allOk=false;}
  FLOW.busy=false;
  if(allOk)finishFlow();else render();
}
async function finishFlow(){
  FLOW.done=true;FLOW.busy=true;render();
  if(!isOffline()){try{await loadFromDB();}catch(e){}}
  _histMemo=null;_tgMemo=null;FLOW.busy=false;render();window.scrollTo(0,0);
  flushQueue();
}

/* ---- Verlauf ---- */
var VL={metric:"kosten",period:"12",sel:null,view:"monate",limit:18,editId:null,editWarn:null,delAsk:null};
var MN=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function mShort(key){return MN[Number(key.slice(5,7))-1]+" "+key.slice(2,4);}
function vlCat(p){var cats=householdCats();return (p.cat&&cats.indexOf(p.cat)>=0)?p.cat:(VL.lastCat&&cats.indexOf(VL.lastCat)>=0?VL.lastCat:cats[0]);}
function rowsByKey(cat){var m={};history(cat).forEach(function(r){if(!r.baseline)m[billKey(r.reading.datum)]=r;});return m;}
function keyAdd(key,n){var y=Number(key.slice(0,4)),m=Number(key.slice(5,7))-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+String(m+1).padStart(2,"0");}
function metricVal(r,metric){if(!r)return null;var v=metric==="kosten"?r.gesamtkosten:r.verbrauch;return isFinite(v)?v:null;}
function chartData(cat){
  var byKey=rowsByKey(cat),keys=Object.keys(byKey).sort();if(!keys.length)return null;
  var list;
  if(VL.period==="12"){var last=keys[keys.length-1];list=[];for(var i=11;i>=0;i--)list.push(keyAdd(last,-i));}
  else{list=[];for(var m=1;m<=12;m++)list.push(VL.period+"-"+String(m).padStart(2,"0"));}
  var items=list.map(function(k){var r=byKey[k],p=byKey[keyAdd(k,-12)];
    return {key:k,v:metricVal(r,VL.metric),prev:metricVal(p,VL.metric),ab:r&&isFinite(r.abschlag)?r.abschlag:null,syn:!!(r&&r.synthetic),row:r};});
  if(VL.period==="12")forecastRows(cat,3).forEach(function(f){items.push({key:billKey(f.reading.datum),v:metricVal(f,VL.metric),prev:metricVal(byKey[keyAdd(billKey(f.reading.datum),-12)],VL.metric),ab:isFinite(f.abschlag)?f.abschlag:null,fc:true});});
  return items;
}
function chartSvg(cat,items){
  var W=640,H=250,pl=10,pr=10,pt=34,pb=38,n=items.length,slot=(W-pl-pr)/n,bw=Math.min(30,slot*0.6);
  var vals=[];items.forEach(function(it){[it.v,it.prev,VL.metric==="kosten"?it.ab:null].forEach(function(x){if(x!=null)vals.push(x);});});
  var mx=Math.max.apply(null,vals.concat([1]))*1.08,Y=function(v){return pt+(H-pt-pb)*(1-v/mx);},X=function(i){return pl+slot*i+slot/2;};
  var col="var(--"+cat+")",out="";
  out+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line-2)"/>';
  items.forEach(function(it,i){
    var x=X(i),on=VL.sel===i;
    if(it.v!=null){var y=Y(it.v),h=Math.max(2,H-pb-y);
      out+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(9,bw/2).toFixed(1)+'" fill="'+col+'" fill-opacity="'+(it.fc?0.14:it.syn?0.45:on?1:0.82)+'"'+(it.fc?' stroke="'+col+'" stroke-dasharray="4 4" stroke-width="1.5"':"")+'/>';}

    if(cat==="wasser")patch.wasser_kanal=obj.wasserKanal;else patch.arbeitspreis=obj.arbeitspreis;
    var ru=await sb.from("tariffs").update(patch).eq("id",editId).select().single();
    if(ru.error)throw ru.error;
    var ix=STATE[cat].tariffs.findIndex(function(t){return t.id===editId;});STATE[cat].tariffs[ix]=rowToTariff(ru.data);
  }else{

/* Datei für die KI vorbereiten: Fotos verkleinern, PDFs unverändert (max. ~6 MB). */
async function aiPayload(file){
  if(/^image\//.test(file.type||""))return await photoB64(file);
  if(file.size>6.5*1024*1024)throw new Error("Das PDF ist zu groß für die KI (max. ca. 6 MB).");
  return {b64:await fileToBase64(file),mime:file.type||"application/pdf"};
}
async function aiExtract(cat,file,mode){
  var docId=null;
  try{var path=await uploadDocFile(cat,file);var rec=await addDocRecord(cat,file,path,mode==="abrechnung"?"abrechnung":"tarif",null,null);docId=rec.id;}catch(e){}
  var p=await aiPayload(file);
  var body={fileBase64:p.b64,mimeType:p.mime,category:cat,level:aiLevel()};if(mode==="abrechnung")body.mode="abrechnung";
  var resp=await sb.functions.invoke("tarif-extract",{body:body});
  if(resp.error)throw resp.error;
  var data=resp.data||{};if(data.error)throw new Error(data.error);
  var out=mode==="abrechnung"?(data.abrechnung||{}):(data.tarif||{});
  if(docId){sb.from("documents").update({extracted:out}).eq("id",docId).then(function(){},function(){});}
  ensureDocs(true);
  return {data:out,docId:docId};
}

async function submitTariffForm(){
  var f=VT.form;if(!f||f.busy)return;readTariffForm();
  var cat=f.cat,v=f.v,wasser=cat==="wasser";
  var grund=parseNum(v.grund),preis=parseNum(v.preis),ab=parseNum(v.abschlag);
  f.err=null;
  if(!v.anbieter.trim())f.err="Bitte den Anbieter eintragen.";
  else if(!isFinite(preis)||preis<0)f.err="Bitte einen gültigen "+(wasser?"Wasser-/Kanalpreis":"Arbeitspreis")+" eintragen.";
  else if(!isFinite(grund)||grund<0)f.err="Bitte einen gültigen Grundpreis eintragen.";
  else if(!isFinite(ab)||ab<0)f.err="Bitte einen gültigen Abschlag eintragen.";
  else if(!v.gueltig)f.err="Bitte „Gültig ab“ wählen.";
  if(f.err){drawTariffForm();return;}
  /* ct/kWh -> €/kWh; Werte unter 2 sind offensichtlich schon in € eingegeben */
  var obj={anbieter:v.anbieter.trim(),grundpreisJahr:grund,abschlag:ab,gueltigAb:v.gueltig,laufzeit:v.laufzeit||null,kuendigungsfrist:v.frist||null,vertragsstart:v.start||null,kundennummer:(v.kdnr||"").trim()||null};
  if(wasser)obj.wasserKanal=preis;else obj.arbeitspreis=preis<2?preis:preis/100;
  var had=!!tariffForDate(cat,todayISO());
  try{await saveTariffData(cat,obj,f.editId);}catch(e){f.err=errMsg(e);drawTariffForm();return;}
  var edited=!!f.editId;VT.form=null;closeSheet();render();
  toast(edited?"Tarif gespeichert":(had?"Tarif gespeichert – der vorherige läuft zum "+deDate(addDays(obj.gueltigAb,-1))+" aus":"Tarif gespeichert"));
}
async function tariffFromAI(cat,file){
  if(!VT.form||VT.form.cat!==cat)VT.form={cat:cat,editId:null,v:tariffFormFrom(cat,null),err:null,ai:null,docId:null};
  VT.form.busy=true;drawTariffForm();
  try{
    var res=await aiExtract(cat,file,"tarif"),t=res.data,f=VT.form;if(!f)return;
    f.docId=res.docId;
    function s(x){return (x==null||x==="")?"":String(x);}
    if(t.anbieter)f.v.anbieter=s(t.anbieter);
    if(t.grundpreisJahr!=null)f.v.grund=s(t.grundpreisJahr).replace(".",",");
    if(cat==="wasser"){if(t.wasserKanal!=null)f.v.preis=s(t.wasserKanal).replace(".",",");}
    else if(t.arbeitspreis!=null&&isFinite(Number(t.arbeitspreis)))f.v.preis=ctFmt(Number(t.arbeitspreis)).replace(/\./g,"");
    if(t.abschlag!=null)f.v.abschlag=s(t.abschlag).replace(".",",");
    if(t.gueltigAb)f.v.gueltig=String(t.gueltigAb).slice(0,10);
    if(["","flex","12","24"].indexOf(s(t.laufzeit))>=0)f.v.laufzeit=s(t.laufzeit);
    if(["","keine","2wochen","4wochen","6wochen","1monat","3monate"].indexOf(s(t.kuendigungsfrist))>=0)f.v.frist=s(t.kuendigungsfrist);
    if(t.vertragsstart)f.v.start=String(t.vertragsstart).slice(0,10);
    if(t.kundennummer)f.v.kdnr=s(t.kundennummer);
    var kk=s(t.kategorie).toLowerCase();
    f.ai={hint:t.hinweise?" "+t.hinweise:"",warn:(kk&&CATS[kk]&&kk!==cat)?"Das Dokument sieht nach "+CATS[kk].label+" aus, du bist bei "+CATS[cat].label+".":""};
  }catch(e){if(VT.form)VT.form.err="KI konnte das Dokument nicht lesen: "+errMsg(e);}
  if(VT.form){VT.form.busy=false;drawTariffForm();}
}

  catch(e){openSheet('<h3>Prüfung fehlgeschlagen</h3><div class="ferr">'+esc(errMsg(e))+'</div><div class="factions"><button class="btn soft full" data-a="sheet-close">Schließen</button></div>');}

function abrSheet(){
  var cat=VT.abr.cat,a=VT.abr.a,c=CATS[cat],u=c.billUnit||c.unit;
  var von=a.zeitraumVon?String(a.zeitraumVon).slice(0,10):null,bis=a.zeitraumBis?String(a.zeitraumBis).slice(0,10):null;
  var erg=abrNum(a.ergebnisBetrag);if(erg!=null)erg=(a.ergebnisArt==="nachzahlung")?-Math.abs(erg):Math.abs(erg);
  var app=periodAppSums(cat,von,bis),warns=0;
  function cmp(label,billV,appV,kind){
    var fmt=function(v){return v==null?"–":(kind==="verb"?fmtVerb(cat,v)+" "+u:eur(v));},badge='<span class="mut-t">–</span>';
    if(billV!=null&&appV!=null){var diff=billV-appV,base=Math.max(Math.abs(billV),Math.abs(appV),1),tol=kind==="verb"?Math.max(base*0.02,5):Math.max(base*0.03,3);
      if(Math.abs(diff)<=tol)badge='<span class="pill pos">'+ic("check",12)+' stimmt</span>';else{badge='<span class="pill neg">Δ '+(kind==="verb"?fmtVerb(cat,diff)+" "+u:eur(diff))+'</span>';warns++;}}
    return '<tr><th>'+label+'</th><td class="num">'+fmt(billV)+'</td><td class="num mut-t">'+fmt(appV)+'</td><td>'+badge+'</td></tr>';
  }
  var ok=app.months>0;
  var rows=cmp("Verbrauch",abrNum(a.verbrauch),ok?app.verbrauch:null,"verb")+cmp("Kosten",abrNum(a.gesamtkosten),ok?app.kosten:null,"eur")+
    cmp("Abschläge",abrNum(a.summeAbschlaege),ok?app.abschlaege:null,"eur")+cmp("Ergebnis",erg,ok?app.ergebnis:null,"eur");
  var na=abrNum(a.neuerAbschlag);
  var verdict=!ok?'<div class="note">'+ic("info")+'<div>Für diesen Zeitraum gibt es keine erfassten Monate – nur die Belegwerte.</div></div>'
    :warns?'<div class="note">'+ic("alert")+'<div><b>'+warns+' Abweichung'+(warns===1?"":"en")+'</b>zu deinen erfassten Daten ('+app.months+' Monate).</div></div>'
    :'<div class="done">'+ic("check",20)+'<span>Alles stimmt<small>'+app.months+' Monate verglichen</small></span></div>';
  openSheet('<h3>Jahresabrechnung '+c.label+'</h3><p class="mut-t" style="font-weight:700;margin:-6px 0 12px">'+esc(a.anbieter||"")+(von?" · "+deDate(von)+" – "+(bis?deDate(bis):"?"):"")+(a.rechnungsnummer?" · Nr. "+esc(String(a.rechnungsnummer)):"")+'</p>'+verdict+
    '<div style="overflow-x:auto;margin-top:12px"><table class="ytab abr"><thead><tr><th></th><th>Beleg</th><th>App</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (a.hinweise?'<p class="mut-t" style="font-size:.86rem;font-weight:700">KI: '+esc(a.hinweise)+'</p>':"")+
    (na!=null?'<div class="factions"><button class="btn full" data-a="vt-abr-ab" data-cat="'+cat+'" data-v="'+na+'">Neuen Abschlag '+eur(na)+' übernehmen</button></div>':"")+
    '<div class="factions" style="margin-top:10px"><button class="btn soft full" data-a="sheet-close">Schließen</button></div>');
}

  navigator.serviceWorker.register(BASE+(IS_TEST?"test/":"")+"sw.js",{scope:BASE+(IS_TEST?"test/":"")}).catch(function(){});
}
render();
sb.auth.onAuthStateChange(function(evt,session){
  setTimeout(function(){
    if(evt==="PASSWORD_RECOVERY")pendingRecovery=true;
    handleSession(session);
  },0);
});

})();
</script>
